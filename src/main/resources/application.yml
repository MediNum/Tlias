# 数据库连接四项
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # 数据库驱动
    url: jdbc:mysql://localhost:3306/web_175 # 数据库连接地址
    username: root # 数据库用户名
    password: 1234 # 数据库密码
    type: com.alibaba.druid.pool.DruidDataSource # 默认连接池
  servlet:
    multipart:
      max-file-size: 1MB # 单个文件最大上传大小
      max-request-size: 10MB # 请求最大上传大小
mybatis:
  mapper-locations: classpath:mapper/*.xml # 映射文件
  configuration:
   log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 声明日志输出路径
   map-underscore-to-camel-case: true # 开启伪表(结果表)列明驼峰转换
pagehelper:
  reasonable: true # 参数合理化(接收到负数页码,超出最大页码)
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
aliyun:
  oss:
    bucket-name: ai-175  # 桶名称
    end-point: https://oss-cn-shanghai.aliyuncs.com # 路径节点地址
jwt:
  secret: jintiashigehaorizi # 加密密钥
  exprired: 3600000 # 过期时间毫秒值